<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Gerenciador de Projetos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .topbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h1 {
            font-size: 22px;
        }

        .topbar .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .topbar .btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 20px;
            border: 4px solid white;
        }

        .profile-header h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .profile-header p {
            opacity: 0.9;
        }

        .profile-body {
            padding: 40px;
        }

        .section-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input:disabled {
            background: #f5f5f5;
            color: #999;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e0e0e0;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #eee;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item .label {
            color: #666;
        }

        .info-item .value {
            font-weight: 500;
            color: #333;
        }

        .security-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>👤 Meu Perfil</h1>
        <button class="btn" onclick="goBack()">← Voltar</button>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar" id="avatarDisplay">V</div>
                <h2 id="nomeDisplay">Carregando...</h2>
                <p id="cargoDisplay">-</p>
            </div>

            <div class="profile-body">
                <div id="alert" class="alert"></div>

                <h3 class="section-title">📝 Informações Pessoais</h3>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required minlength="3">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" disabled>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" placeholder="(11) 99999-9999">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cargo">Cargo/Função</label>
                            <select id="cargo">
                                <option value="Engenheiro">Engenheiro</option>
                                <option value="Arquiteto">Arquiteto</option>
                                <option value="Técnico">Técnico</option>
                                <option value="Gestor">Gestor</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="especialidade">Especialidade</label>
                            <input type="text" id="especialidade" placeholder="Ex: Estruturas, Hidráulica...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bio">Mini Biografia</label>
                        <textarea id="bio" rows="3" placeholder="Conte um pouco sobre você..."></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">Salvar Alterações</button>
                    </div>
                </form>

                <div class="security-section">
                    <h3 class="section-title">🔐 Segurança</h3>
                    
                    <div class="info-item">
                        <span class="label">Email cadastrado</span>
                        <span class="value" id="emailInfo">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Conta criada em</span>
                        <span class="value" id="dataCriacaoInfo">-</span>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary" onclick="window.location.href='change-password.html'">
                            🔑 Alterar Senha
                        </button>
                        <button type="button" class="btn-danger" onclick="confirmDeleteAccount()">
                            🗑️ Excluir Conta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="api-client.js"></script>
    <script>
        // Verificar autenticação
        if (!api.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        const user = api.user;
        const alertDiv = document.getElementById('alert');

        function showAlert(message, type = 'success') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
        }

        function loadProfile() {
            // Carregar dados do localStorage
            const nome = user.nome || 'Usuário';
            const email = user.email || '-';
            const cargo = user.cargo || 'Engenheiro';
            const telefone = user.telefone || '';
            const especialidade = user.especialidade || '';
            const bio = user.bio || '';

            // Header
            document.getElementById('avatarDisplay').textContent = nome.charAt(0).toUpperCase();
            document.getElementById('nomeDisplay').textContent = nome;
            document.getElementById('cargoDisplay').textContent = cargo;

            // Form
            document.getElementById('nome').value = nome;
            document.getElementById('email').value = email;
            document.getElementById('telefone').value = telefone;
            document.getElementById('cargo').value = cargo;
            document.getElementById('especialidade').value = especialidade;
            document.getElementById('bio').value = bio;

            // Info
            document.getElementById('emailInfo').textContent = email;
            document.getElementById('dataCriacaoInfo').textContent = user.data_criacao 
                ? new Date(user.data_criacao).toLocaleDateString('pt-BR') 
                : 'Não disponível';
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const updatedData = {
                ...user,
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                cargo: document.getElementById('cargo').value,
                especialidade: document.getElementById('especialidade').value,
                bio: document.getElementById('bio').value
            };

            try {
                // Atualizar localmente (em produção, enviaria para API)
                localStorage.setItem('user', JSON.stringify(updatedData));
                api.user = updatedData;

                // Atualizar header
                document.getElementById('avatarDisplay').textContent = updatedData.nome.charAt(0).toUpperCase();
                document.getElementById('nomeDisplay').textContent = updatedData.nome;
                document.getElementById('cargoDisplay').textContent = updatedData.cargo;

                showAlert('Perfil atualizado com sucesso!', 'success');
            } catch (error) {
                showAlert('Erro ao atualizar perfil: ' + error.message, 'error');
            }
        });

        function confirmDeleteAccount() {
            const confirmText = prompt('Para excluir sua conta, digite "EXCLUIR":');
            if (confirmText === 'EXCLUIR') {
                if (confirm('Tem certeza absoluta? Esta ação não pode ser desfeita!')) {
                    alert('Funcionalidade em desenvolvimento. Contate o administrador.');
                }
            }
        }

        function goBack() {
            window.location.href = 'projects/index.html';
        }

        // Carregar perfil ao iniciar
        loadProfile();
    </script>
</body>
</html>
