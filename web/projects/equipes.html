<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipes — Gerenciador de Projetos</title>
  <link rel="stylesheet" href="equipes.css">
</head>
<body>
  <header class="topbar">
    <h1>👥 Equipe do Projeto</h1>
    <div class="top-controls">
      <button id="addMemberBtn" class="btn primary">➕ Adicionar Membro</button>
      <button id="inviteBtn" class="btn">✉️ Convidar por Email</button>
      <button onclick="location.href='kanban.html?project='+projectId" class="btn">📋 Kanban</button>
      <button onclick="location.href='docs.html?project='+projectId" class="btn">📄 Documentos</button>
      <button onclick="location.href='index.html'" class="btn">🏠 Projetos</button>
    </div>
  </header>
  
  <main class="equipes-container">
    <!-- Resumo da Equipe -->
    <section class="team-summary">
      <div class="summary-card">
        <div class="icon">👥</div>
        <div class="value" id="totalMembers">0</div>
        <div class="label">Total de Membros</div>
      </div>
      <div class="summary-card">
        <div class="icon">👷</div>
        <div class="value" id="activeMembers">0</div>
        <div class="label">Membros Ativos</div>
      </div>
      <div class="summary-card">
        <div class="icon">📧</div>
        <div class="value" id="pendingInvites">0</div>
        <div class="label">Convites Pendentes</div>
      </div>
    </section>

    <!-- Filtros -->
    <section class="filters">
      <label>
        🔍 Buscar:
        <input type="text" id="searchMember" placeholder="Nome ou email..." />
      </label>
      <label>
        📋 Papel:
        <select id="filterRole">
          <option value="">Todos</option>
          <option value="gerente">Gerente</option>
          <option value="engenheiro">Engenheiro</option>
          <option value="tecnico">Técnico</option>
          <option value="colaborador">Colaborador</option>
        </select>
      </label>
      <label>
        ✅ Status:
        <select id="filterStatus">
          <option value="">Todos</option>
          <option value="ativo">Ativos</option>
          <option value="inativo">Inativos</option>
        </select>
      </label>
    </section>

    <!-- Lista de Membros -->
    <section class="members-grid" id="membersGrid">
      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <h3>Nenhum membro na equipe</h3>
        <p>Adicione membros ou envie convites por email</p>
      </div>
    </section>

    <!-- Convites Pendentes -->
    <section class="invites-section" id="invitesSection" style="display:none;">
      <h2>✉️ Convites Pendentes</h2>
      <div class="invites-list" id="invitesList"></div>
    </section>
  </main>

  <!-- Modal Adicionar Membro -->
  <div id="memberModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" id="closeMemberModal">&times;</span>
      <h2 id="modalMemberTitle">➕ Adicionar Membro</h2>
      <form id="memberForm">
        <input type="hidden" id="memberId" />
        <div class="form-group">
          <label for="memberUser">Usuário</label>
          <select id="memberUser" required>
            <option value="">Selecione um usuário...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="memberRole">Papel na Equipe</label>
          <select id="memberRole" required>
            <option value="colaborador">👤 Colaborador</option>
            <option value="tecnico">🔧 Técnico</option>
            <option value="engenheiro">👷 Engenheiro</option>
            <option value="gerente">👔 Gerente</option>
          </select>
        </div>
        <div class="form-group">
          <label for="memberStartDate">Data de Entrada</label>
          <input type="date" id="memberStartDate" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">Salvar</button>
          <button type="button" class="btn" onclick="closeMemberModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Convidar por Email -->
  <div id="inviteModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" id="closeInviteModal">&times;</span>
      <h2>✉️ Convidar por Email</h2>
      <form id="inviteForm">
        <div class="form-group">
          <label for="inviteEmail">Email do Convidado</label>
          <input type="email" id="inviteEmail" required placeholder="email@exemplo.com" />
        </div>
        <div class="form-group">
          <label for="inviteRole">Papel na Equipe</label>
          <select id="inviteRole" required>
            <option value="colaborador">👤 Colaborador</option>
            <option value="tecnico">🔧 Técnico</option>
            <option value="engenheiro">👷 Engenheiro</option>
            <option value="gerente">👔 Gerente</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inviteExpiration">Expiração (horas)</label>
          <input type="number" id="inviteExpiration" value="48" min="1" max="168" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">Enviar Convite</button>
          <button type="button" class="btn" onclick="closeInviteModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../api-client.js"></script>
  <script>
    let projectId = null;
    let members = [];
    let invites = [];

    // Inicialização
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      projectId = params.get('project');
      
      if (!projectId) {
        alert('Projeto não especificado');
        window.location.href = 'index.html';
        return;
      }

      // Event listeners
      document.getElementById('addMemberBtn').onclick = openAddMemberModal;
      document.getElementById('inviteBtn').onclick = openInviteModal;
      document.getElementById('closeMemberModal').onclick = closeMemberModal;
      document.getElementById('closeInviteModal').onclick = closeInviteModal;
      document.getElementById('memberForm').onsubmit = saveMember;
      document.getElementById('inviteForm').onsubmit = sendInvite;
      document.getElementById('searchMember').oninput = filterMembers;
      document.getElementById('filterRole').onchange = filterMembers;
      document.getElementById('filterStatus').onchange = filterMembers;

      await loadMembers();
      await loadInvites();
      await loadAvailableUsers();
    });

    // Carregar membros
    async function loadMembers() {
      try {
        const response = await api.get(`/equipes/projeto/${projectId}`);
        members = response.membros || response || [];
        renderMembers();
        updateSummary();
      } catch (error) {
        console.error('Erro ao carregar membros:', error);
        members = [];
        renderMembers();
      }
    }

    // Carregar convites pendentes
    async function loadInvites() {
      try {
        const response = await api.get(`/equipes/projeto/${projectId}/convites`);
        invites = response.convites || response || [];
        renderInvites();
        updateSummary();
      } catch (error) {
        console.error('Erro ao carregar convites:', error);
        invites = [];
      }
    }

    // Carregar usuários disponíveis
    async function loadAvailableUsers() {
      try {
        const response = await api.get('/auth/usuarios');
        const users = response.usuarios || response || [];
        const select = document.getElementById('memberUser');
        select.innerHTML = '<option value="">Selecione um usuário...</option>';
        users.forEach(user => {
          select.innerHTML += `<option value="${user.id}">${user.nome} (${user.email})</option>`;
        });
      } catch (error) {
        console.error('Erro ao carregar usuários:', error);
      }
    }

    // Renderizar membros
    function renderMembers() {
      const grid = document.getElementById('membersGrid');
      
      if (members.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <h3>Nenhum membro na equipe</h3>
            <p>Adicione membros ou envie convites por email</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = members.map(member => `
        <div class="member-card ${member.ativo ? '' : 'inactive'}">
          <div class="member-avatar">
            ${member.usuario_nome ? member.usuario_nome.charAt(0).toUpperCase() : '?'}
          </div>
          <div class="member-info">
            <h3>${member.usuario_nome || 'Usuário'}</h3>
            <p class="member-email">${member.usuario_email || ''}</p>
            <span class="role-badge ${member.papel}">${getRoleLabel(member.papel)}</span>
          </div>
          <div class="member-meta">
            <span class="status-indicator ${member.ativo ? 'active' : 'inactive'}">
              ${member.ativo ? '● Ativo' : '○ Inativo'}
            </span>
            <span class="join-date">Desde ${formatDate(member.data_entrada)}</span>
          </div>
          <div class="member-actions">
            <button class="btn btn-sm" onclick="editMember(${member.id})">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="removeMember(${member.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // Renderizar convites
    function renderInvites() {
      const section = document.getElementById('invitesSection');
      const list = document.getElementById('invitesList');
      
      if (invites.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = invites.map(invite => `
        <div class="invite-card">
          <div class="invite-info">
            <span class="invite-email">📧 ${invite.email_convidado}</span>
            <span class="invite-role">${getRoleLabel(invite.papel)}</span>
          </div>
          <div class="invite-status">
            <span class="invite-expiry">Expira em ${formatDate(invite.expira_em)}</span>
            <button class="btn btn-sm btn-danger" onclick="cancelInvite(${invite.id})">Cancelar</button>
          </div>
        </div>
      `).join('');
    }

    // Atualizar resumo
    function updateSummary() {
      document.getElementById('totalMembers').textContent = members.length;
      document.getElementById('activeMembers').textContent = members.filter(m => m.ativo).length;
      document.getElementById('pendingInvites').textContent = invites.length;
    }

    // Utilitários
    function getRoleLabel(role) {
      const roles = {
        'gerente': '👔 Gerente',
        'engenheiro': '👷 Engenheiro',
        'tecnico': '🔧 Técnico',
        'colaborador': '👤 Colaborador'
      };
      return roles[role] || role;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleDateString('pt-BR');
    }

    // Modais
    function openAddMemberModal() {
      document.getElementById('memberId').value = '';
      document.getElementById('memberForm').reset();
      document.getElementById('modalMemberTitle').textContent = '➕ Adicionar Membro';
      document.getElementById('memberModal').style.display = 'flex';
    }

    function closeMemberModal() {
      document.getElementById('memberModal').style.display = 'none';
    }

    function openInviteModal() {
      document.getElementById('inviteForm').reset();
      document.getElementById('inviteModal').style.display = 'flex';
    }

    function closeInviteModal() {
      document.getElementById('inviteModal').style.display = 'none';
    }

    // CRUD
    async function saveMember(e) {
      e.preventDefault();
      const data = {
        projeto_id: parseInt(projectId),
        usuario_id: parseInt(document.getElementById('memberUser').value),
        papel: document.getElementById('memberRole').value,
        data_entrada: document.getElementById('memberStartDate').value || null
      };

      try {
        await api.post('/equipes/', data);
        closeMemberModal();
        await loadMembers();
        alert('Membro adicionado com sucesso!');
      } catch (error) {
        alert('Erro ao adicionar membro: ' + error.message);
      }
    }

    async function sendInvite(e) {
      e.preventDefault();
      const data = {
        projeto_id: parseInt(projectId),
        email_convidado: document.getElementById('inviteEmail').value,
        papel: document.getElementById('inviteRole').value,
        expiracao_horas: parseInt(document.getElementById('inviteExpiration').value)
      };

      try {
        await api.post('/equipes/convite', data);
        closeInviteModal();
        await loadInvites();
        alert('Convite enviado com sucesso!');
      } catch (error) {
        alert('Erro ao enviar convite: ' + error.message);
      }
    }

    async function removeMember(memberId) {
      if (!confirm('Tem certeza que deseja remover este membro?')) return;
      
      try {
        await api.delete(`/equipes/${memberId}`);
        await loadMembers();
        alert('Membro removido com sucesso!');
      } catch (error) {
        alert('Erro ao remover membro: ' + error.message);
      }
    }

    async function cancelInvite(inviteId) {
      if (!confirm('Cancelar este convite?')) return;
      
      try {
        await api.delete(`/equipes/convite/${inviteId}`);
        await loadInvites();
        alert('Convite cancelado!');
      } catch (error) {
        alert('Erro ao cancelar convite: ' + error.message);
      }
    }

    function filterMembers() {
      const search = document.getElementById('searchMember').value.toLowerCase();
      const role = document.getElementById('filterRole').value;
      const status = document.getElementById('filterStatus').value;

      const filtered = members.filter(m => {
        const matchSearch = !search || 
          (m.usuario_nome && m.usuario_nome.toLowerCase().includes(search)) ||
          (m.usuario_email && m.usuario_email.toLowerCase().includes(search));
        const matchRole = !role || m.papel === role;
        const matchStatus = !status || 
          (status === 'ativo' && m.ativo) || 
          (status === 'inativo' && !m.ativo);
        return matchSearch && matchRole && matchStatus;
      });

      const grid = document.getElementById('membersGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>Nenhum membro encontrado</p></div>`;
      } else {
        const originalMembers = members;
        members = filtered;
        renderMembers();
        members = originalMembers;
      }
    }
  </script>
</body>
</html>
