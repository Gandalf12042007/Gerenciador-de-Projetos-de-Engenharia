<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projetos — Gerenciador de Projetos de Engenharia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Projetos</h1>
    <div class="top-controls">
      <button id="newProjectBtn" class="btn primary">Criar novo projeto</button>
      <button onclick="location.href='dashboard.html'" class="btn" style="margin-left:10px;">📊 Dashboard</button>
      <button onclick="location.href='timeline.html'" class="btn" style="margin-left:10px;">📅 Timeline</button>
      <button id="notificationsBtn" class="btn" style="margin-left:10px; position:relative;">
        🔔 <span id="notifBadge" style="display:none; position:absolute; top:-5px; right:-5px; background:#e53e3e; color:white; border-radius:50%; width:18px; height:18px; font-size:0.7rem; display:flex; align-items:center; justify-content:center;">0</span>
      </button>
      <button id="profileBtn" class="btn" style="margin-left:10px;">👤 Perfil</button>
      <button id="logoutBtn" class="btn" style="margin-left:10px;">Sair</button>
    </div>
  </header>

  <main class="container">
    <!-- Modal Projeto -->
    <div id="projectModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span class="close" id="closeProjectModal">&times;</span>
        <h2 id="modalTitle">Novo Projeto</h2>
        <form id="projectForm">
          <input type="hidden" id="projectId" />
          <div class="form-group">
            <label for="projectName">Nome do Projeto *</label>
            <input type="text" id="projectName" required placeholder="Digite o nome do projeto" />
          </div>
          <div class="form-group">
            <label for="projectCity">Cidade/Localização</label>
            <input type="text" id="projectCity" placeholder="Ex: São Paulo, SP" />
          </div>
          <div class="form-group">
            <label for="projectManager">Cliente/Gerente</label>
            <input type="text" id="projectManager" placeholder="Nome do cliente ou gerente" />
          </div>
          <div class="form-group">
            <label for="projectStart">Data de Início</label>
            <input type="date" id="projectStart" min="2000-01-01" max="2100-12-31" />
            <small style="color:#6b7280; font-size:0.8rem;">Datas válidas: 2000 a 2100</small>
          </div>
          <div class="form-group">
            <label for="projectEnd">Data de Conclusão Prevista</label>
            <input type="date" id="projectEnd" min="2000-01-01" max="2100-12-31" />
          </div>
          <div class="form-group">
            <label for="projectStatus">Status</label>
            <select id="projectStatus">
              <option value="planejamento">📋 Planejamento</option>
              <option value="em_andamento">🚧 Em Andamento</option>
              <option value="pausado">⏸️ Pausado</option>
              <option value="concluido">✅ Concluído</option>
              <option value="cancelado">❌ Cancelado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="projectProgress">Progresso: <span id="progressValue">0</span>%</label>
            <input type="range" id="projectProgress" min="0" max="100" value="0" 
                   oninput="document.getElementById('progressValue').textContent = this.value" 
                   style="width:100%; cursor:pointer;" />
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#6b7280;">
              <span>0%</span>
              <span>50%</span>
              <span>100%</span>
            </div>
          </div>
          <div style="display:flex; gap:10px; margin-top:20px;">
            <button type="submit" class="btn primary" id="saveProjectBtn" style="flex:1;">💾 Salvar Projeto</button>
            <button type="button" class="btn" onclick="closeProjectModal()" style="flex:0.5;">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
    <section class="dashboard">
      <div class="metrics">
        <div class="metric">Obras ativas<br><strong id="count-active">0</strong></div>
        <div class="metric">Tarefas pendentes<br><strong id="count-pending">0</strong></div>
        <div class="metric">Tarefas atrasadas<br><strong id="count-delayed">0</strong></div>
        <div class="metric">% Progresso médio<br><strong id="avg-progress">0%</strong></div>
      </div>

      <div class="filters">
        <label>
          Status:
          <select id="filter-status">
            <option value="all">Todos</option>
            <option value="planejamento">Planejamento</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="pausado">Pausado</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </label>

        <label>
          Procurar:
          <input id="filter-q" placeholder="Nome do projeto, cidade..." />
        </label>

        <button id="clearFilters" class="btn">Limpar</button>
      </div>
    </section>

    <section class="project-list" id="projectList">
      <!-- Cards will be rendered here -->
    </section>
  </main>

  <script src="../api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
