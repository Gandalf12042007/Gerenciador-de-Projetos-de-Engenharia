<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Gerenciador de Projetos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: 
                radial-gradient(ellipse at top, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                var(--bg-primary);
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 0.5s ease forwards;
        }

        .register-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-xl);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: var(--gradient-secondary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-secondary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        .password-requirements {
            background: var(--bg-tertiary);
            border-radius: var(--border-radius-md);
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 0.8125rem;
        }

        .password-requirements ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .password-requirements li {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .password-requirements li:last-child {
            margin-bottom: 0;
        }

        .password-requirements li.valid {
            color: var(--color-success);
        }

        .password-requirements li .icon {
            width: 16px;
            text-align: center;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .form-input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        .login-link {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }

        .login-link a {
            color: var(--color-primary);
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <div class="logo-icon">👤</div>
                <h1>Criar Conta</h1>
                <p>Junte-se à nossa plataforma</p>
            </div>

            <div id="alert" class="alert" style="display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" class="form-input" 
                           required placeholder="Seu nome completo" minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" 
                           required placeholder="seu@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" class="form-input" 
                               required placeholder="Mínimo 8 caracteres" minlength="8">
                        <button type="button" class="password-toggle" data-target="senha">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="password-requirements" id="passwordRequirements">
                        <ul>
                            <li id="req-length"><span class="icon">○</span> Mínimo 8 caracteres</li>
                            <li id="req-upper"><span class="icon">○</span> Uma letra maiúscula</li>
                            <li id="req-number"><span class="icon">○</span> Um número</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmarSenha">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-input" 
                               required placeholder="Repita a senha">
                        <button type="button" class="password-toggle" data-target="confirmarSenha">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full" id="btnRegister">
                    <span id="btnText">Criar Conta</span>
                    <span id="btnLoading" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="login-link">
                Já tem conta? <a href="login.html">Fazer login</a>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const btnRegister = document.getElementById('btnRegister');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const alertDiv = document.getElementById('alert');
        const senhaInput = document.getElementById('senha');

        // Password toggles
        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                input.type = input.type === 'password' ? 'text' : 'password';
            });
        });

        // Password validation
        senhaInput.addEventListener('input', () => {
            const senha = senhaInput.value;
            
            updateRequirement('req-length', senha.length >= 8);
            updateRequirement('req-upper', /[A-Z]/.test(senha));
            updateRequirement('req-number', /[0-9]/.test(senha));
        });

        function updateRequirement(id, valid) {
            const el = document.getElementById(id);
            if (valid) {
                el.classList.add('valid');
                el.querySelector('.icon').textContent = '✓';
            } else {
                el.classList.remove('valid');
                el.querySelector('.icon').textContent = '○';
            }
        }

        function showAlert(message, type = 'error') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'flex';
            
            if (type === 'error') {
                alertDiv.classList.add('shake');
                setTimeout(() => alertDiv.classList.remove('shake'), 500);
            }
            
            if (type !== 'error') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
        }

        function setLoading(loading) {
            btnRegister.disabled = loading;
            btnText.style.display = loading ? 'none' : 'inline';
            btnLoading.style.display = loading ? 'inline-block' : 'none';
        }

        function validatePassword(senha) {
            if (senha.length < 8) return false;
            if (!/[A-Z]/.test(senha)) return false;
            if (!/[0-9]/.test(senha)) return false;
            return true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            // Validações
            if (nome.length < 3) {
                showAlert('Nome deve ter no mínimo 3 caracteres');
                return;
            }

            if (!validatePassword(senha)) {
                showAlert('Senha não atende aos requisitos mínimos');
                return;
            }

            if (senha !== confirmarSenha) {
                showAlert('As senhas não coincidem');
                return;
            }

            setLoading(true);
            alertDiv.style.display = 'none';

            try {
                const response = await api.register(nome, email, senha);
                
                showAlert('Conta criada com sucesso! Redirecionando...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (error) {
                showAlert(error.message || 'Erro ao criar conta. Tente novamente.');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
