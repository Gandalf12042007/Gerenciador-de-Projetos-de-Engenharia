<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Projetos</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: 
                linear-gradient(135deg, rgba(10, 22, 40, 0.85) 0%, rgba(20, 40, 70, 0.80) 100%),
                url('assets/images/bg-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(248,250,252,0.95) 100%);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.1);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1e3a5f;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 50%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.45);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #1E3A5F;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            color: #555;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-google:hover {
            background: #f8f9fa;
            border-color: #4285f4;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.2);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏗️ Gerenciador</h1>
            <p>Projetos de Engenharia Civil</p>
        </div>

        <div id="alert" class="alert" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required 
                       placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required
                       placeholder="••••••••">
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="manterConectado" name="manterConectado" style="width: auto;">
                <label for="manterConectado" style="margin: 0; font-weight: normal; font-size: 14px; color: #666;">
                    Manter conectado
                </label>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Entrar
            </button>

            <div class="loading" id="loading">Entrando...</div>
        </form>

        <div class="divider"><span>ou</span></div>

        <button type="button" class="btn-google" id="btnGoogleLogin">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Entrar com Google
        </button>

        <div class="forgot-password" style="text-align: center; margin-top: 15px;">
            <a href="forgot-password.html" style="color: #667eea; text-decoration: none; font-size: 14px;">
                Esqueci minha senha
            </a>
        </div>

        <div class="register-link">
            Não tem conta? <a href="register.html">Cadastre-se</a>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const loading = document.getElementById('loading');
        const alertDiv = document.getElementById('alert');

        // Verificar se há parâmetro de logout na URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            api.logout();
            // Limpar o parâmetro da URL
            window.history.replaceState({}, document.title, 'login.html');
        }

        // Só redireciona se tiver token E usuário válido E não veio de logout
        if (api.isAuthenticated() && api.user && api.user.id && !urlParams.get('logout')) {
            // Verificar se o token ainda é válido tentando uma requisição
            api.get('/projetos').then(() => {
                window.location.href = 'projects/index.html';
            }).catch(() => {
                // Token inválido, limpa e fica no login
                api.logout();
            });
        }

        function showAlert(message, type = 'error') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const manterConectado = document.getElementById('manterConectado').checked;

            btnLogin.disabled = true;
            loading.classList.add('active');
            alertDiv.style.display = 'none';

            try {
                const response = await api.login(email, senha);
                
                // Backend retorna: { access_token, token_type, user_id, nome, email }
                const user = {
                    id: response.user_id,
                    nome: response.nome,
                    email: response.email
                };
                
                api.setAuth(response.access_token, user);
                
                // Salvar preferência de "manter conectado"
                if (manterConectado) {
                    localStorage.setItem('keep_logged_in', 'true');
                } else {
                    sessionStorage.setItem('session_only', 'true');
                    localStorage.removeItem('keep_logged_in');
                }
                
                showAlert('Login realizado com sucesso!', 'success');
                
                setTimeout(() => {
                    window.location.href = 'projects/index.html';
                }, 1000);

            } catch (error) {
                showAlert(error.message || 'Erro ao fazer login. Verifique suas credenciais.');
                btnLogin.disabled = false;
                loading.classList.remove('active');
            }
        });

        // Google Sign-In
        const GOOGLE_CLIENT_ID = ''; // Adicione seu Client ID do Google aqui

        document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
            if (!GOOGLE_CLIENT_ID) {
                // Modo simulado - cria usuário fictício
                const mockUser = {
                    id: Date.now(),
                    nome: 'Usuário Google',
                    email: 'usuario@gmail.com'
                };
                
                // Criar token local para teste
                const mockToken = 'google_mock_' + Date.now();
                api.setAuth(mockToken, mockUser);
                localStorage.setItem('keep_logged_in', 'true');
                
                showAlert('Login simulado com Google!', 'success');
                setTimeout(() => {
                    window.location.href = 'projects/index.html';
                }, 1000);
                return;
            }

            // Inicializar Google Sign-In
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredential
            });

            // Mostrar popup de login
            google.accounts.id.prompt();
        });

        async function handleGoogleCredential(response) {
            try {
                loading.classList.add('active');
                btnLogin.disabled = true;

                const res = await fetch('http://localhost:8000/auth/google-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                if (res.ok) {
                    const data = await res.json();
                    const user = {
                        id: data.user_id,
                        nome: data.nome,
                        email: data.email,
                        picture: data.picture
                    };
                    
                    api.setAuth(data.access_token, user);
                    localStorage.setItem('keep_logged_in', 'true');
                    
                    showAlert('Login com Google realizado!', 'success');
                    setTimeout(() => {
                        window.location.href = 'projects/index.html';
                    }, 1000);
                } else {
                    const error = await res.json();
                    showAlert(error.detail || 'Erro no login com Google');
                }
            } catch (error) {
                showAlert('Erro ao conectar com Google: ' + error.message);
            } finally {
                loading.classList.remove('active');
                btnLogin.disabled = false;
            }
        }
    </script>
</body>
</html>
