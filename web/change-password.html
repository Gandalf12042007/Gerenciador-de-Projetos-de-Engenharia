<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - Gerenciador de Projetos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: 
                linear-gradient(135deg, rgba(30, 58, 95, 0.90) 0%, rgba(15, 39, 68, 0.85) 100%),
                url('bg-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1E3A5F 0%, #2C5282 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1E3A5F;
        }

        .password-requirements {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .password-requirements ul {
            margin-top: 5px;
            padding-left: 20px;
        }

        .password-requirements li {
            margin-bottom: 3px;
        }

        .password-requirements li.valid {
            color: #2a7;
        }

        .password-requirements li.invalid {
            color: #c33;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1E3A5F 0%, #2C5282 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 58, 95, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #eee;
            border-color: #ccc;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #2a7;
            border: 1px solid #cfc;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .divider {
            border-top: 1px solid #eee;
            margin: 25px 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Alterar Senha</h1>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <span id="userName">Usuário</span>
            </div>
        </div>

        <div id="alert" class="alert"></div>

        <form id="changePasswordForm">
            <div class="form-group">
                <label for="senhaAtual">Senha Atual</label>
                <input type="password" id="senhaAtual" name="senhaAtual" required 
                       placeholder="Digite sua senha atual">
            </div>

            <div class="divider"></div>

            <div class="form-group">
                <label for="novaSenha">Nova Senha</label>
                <input type="password" id="novaSenha" name="novaSenha" required 
                       placeholder="Digite a nova senha" minlength="8">
                <div class="password-requirements">
                    <ul>
                        <li id="req-length">Mínimo 8 caracteres</li>
                        <li id="req-upper">Pelo menos 1 letra maiúscula</li>
                        <li id="req-number">Pelo menos 1 número</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar Nova Senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required 
                       placeholder="Repita a nova senha">
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                Alterar Senha
            </button>

            <button type="button" class="btn-secondary" onclick="goBack()">
                Cancelar
            </button>

            <div class="loading" id="loading">Processando...</div>
        </form>
    </div>

    <script src="api-client.js"></script>
    <script>
        // Verificar autenticação
        if (!api.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        // Mostrar info do usuário
        const user = api.user;
        if (user && user.nome) {
            document.getElementById('userName').textContent = user.nome;
            document.getElementById('userAvatar').textContent = user.nome.charAt(0).toUpperCase();
        }

        const form = document.getElementById('changePasswordForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const loading = document.getElementById('loading');
        const alertDiv = document.getElementById('alert');
        const novaSenhaInput = document.getElementById('novaSenha');

        // Validação em tempo real
        novaSenhaInput.addEventListener('input', validatePassword);

        function validatePassword() {
            const senha = novaSenhaInput.value;
            
            const reqLength = document.getElementById('req-length');
            const reqUpper = document.getElementById('req-upper');
            const reqNumber = document.getElementById('req-number');

            // Mínimo 8 caracteres
            if (senha.length >= 8) {
                reqLength.classList.add('valid');
                reqLength.classList.remove('invalid');
            } else {
                reqLength.classList.add('invalid');
                reqLength.classList.remove('valid');
            }

            // Pelo menos 1 maiúscula
            if (/[A-Z]/.test(senha)) {
                reqUpper.classList.add('valid');
                reqUpper.classList.remove('invalid');
            } else {
                reqUpper.classList.add('invalid');
                reqUpper.classList.remove('valid');
            }

            // Pelo menos 1 número
            if (/[0-9]/.test(senha)) {
                reqNumber.classList.add('valid');
                reqNumber.classList.remove('invalid');
            } else {
                reqNumber.classList.add('invalid');
                reqNumber.classList.remove('valid');
            }
        }

        function showAlert(message, type = 'error') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            // Auto-hide success
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
        }

        function isPasswordValid(senha) {
            return senha.length >= 8 && /[A-Z]/.test(senha) && /[0-9]/.test(senha);
        }

        function goBack() {
            // Voltar para página anterior ou dashboard
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'projects/index.html';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const senhaAtual = document.getElementById('senhaAtual').value;
            const novaSenha = novaSenhaInput.value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            // Validar força da senha
            if (!isPasswordValid(novaSenha)) {
                showAlert('A nova senha não atende aos requisitos mínimos.');
                return;
            }

            // Verificar se senhas coincidem
            if (novaSenha !== confirmarSenha) {
                showAlert('As senhas não coincidem.');
                return;
            }

            // Verificar se é diferente da atual
            if (senhaAtual === novaSenha) {
                showAlert('A nova senha deve ser diferente da senha atual.');
                return;
            }

            btnSubmit.disabled = true;
            loading.classList.add('active');
            alertDiv.style.display = 'none';

            try {
                await api.changePassword(senhaAtual, novaSenha);
                showAlert('Senha alterada com sucesso!', 'success');
                
                // Limpar formulário
                form.reset();
                
                // Redirecionar após 2 segundos
                setTimeout(() => {
                    goBack();
                }, 2000);
                
            } catch (error) {
                showAlert(error.message || 'Erro ao alterar senha. Verifique sua senha atual.');
            } finally {
                btnSubmit.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
