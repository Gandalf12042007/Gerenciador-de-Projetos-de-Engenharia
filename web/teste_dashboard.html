<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Teste</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: #f5f5f5; }
        .console { background: #1e1e1e; color: #00ff00; padding: 20px; margin: 20px; font-family: 'Courier New'; font-size: 12px; border-radius: 5px; max-height: 300px; overflow-y: auto; }
        .console-error { color: #ff6666; }
        .console-warn { color: #ffcc00; }
        .console-log { color: #00ff00; }
        .console-info { color: #66ccff; }
        button { margin: 10px; padding: 10px 20px; background: #007acc; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a9e; }
        .container { margin: 20px; }
        h1 { color: #333; margin: 20px; }
    </style>
</head>
<body>
    <h1>🧪 Teste de Dashboard com Token Pré-configurado</h1>
    
    <div class="container">
        <button onclick="setupAuth()">1️⃣ Configurar Auth</button>
        <button onclick="testDashboard()">2️⃣ Carregar Dashboard</button>
        <button onclick="clearLogs()">🗑️ Limpar Console</button>
    </div>

    <div class="console" id="console"></div>

    <script>
        const CONSOLE = document.getElementById('console');
        const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJlbWFpbCI6InZpY2VudGVkZXNvdXphNzYyQGdtYWlsLmNvbSIsIm5vbWUiOiJWaWNlbnRlIGRlIFNvdXphIiwicm9sZSI6ImFkbWluIiwiZXhwIjoxNzcyNDk2MTI5fQ.sKeub1zXCuseYJLYF8xwgYvBqvJQj2KR4Yh6BtqduqU";
        const USER = { id: 1, nome: "Vicente de Souza", email: "vicentedesouza762@gmail.com", role: "admin" };

        // Override console
        const originalLog = console.log, originalError = console.error, originalWarn = console.warn;
        
        console.log = function(...args) {
            originalLog(...args);
            addLog('LOG', args.join(' '));
        };
        
        console.error = function(...args) {
            originalError(...args);
            addLog('ERROR', args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn(...args);
            addLog('WARN', args.join(' '), 'warn');
        };

        function addLog(type, message, style = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const className = `console-${style}`;
            const line = document.createElement('div');
            line.className = className;
            line.textContent = `[${timestamp}] ${type}: ${message}`;
            CONSOLE.appendChild(line);
            CONSOLE.scrollTop = CONSOLE.scrollHeight;
        }

        function clearLogs() {
            CONSOLE.innerHTML = '';
        }

        function setupAuth() {
            console.log('Configurando autenticação...');
            localStorage.setItem('access_token', TOKEN);
            localStorage.setItem('user', JSON.stringify(USER));
            console.log('✅ Token e usuário salvos em localStorage');
            console.log('Token:', TOKEN.substring(0, 20) + '...');
            console.log('User:', USER);
        }

        async function testDashboard() {
            console.log('Iniciando teste do dashboard...');
            
            try {
                // Simular carregamento de dashboard
                setupAuth();

                // Carregar projetos
                console.log('Carregando projetos...');
                const projectsResp = await fetch('/api/projetos/', {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                
                if (!projectsResp.ok) {
                    throw new Error(`/api/projetos/ retornou ${projectsResp.status}`);
                }
                
                const projects = await projectsResp.json();
                console.log(`✅ Projetos carregados: ${projects.length}`);
                
                // Carregar tarefas
                console.log('Carregando tarefas...');
                const tasksMap = {};
                for (const project of projects) {
                    const tasksResp = await fetch(`/api/tarefas/projeto/${project.id}`, {
                        headers: { 'Authorization': `Bearer ${TOKEN}` }
                    });
                    
                    if (tasksResp.ok) {
                        const tasks = await tasksResp.json();
                        tasksMap[project.id] = tasks;
                        console.log(`✅ Projeto ${project.id}: ${tasks.length} tarefas`);
                    } else {
                        console.warn(`⚠️ Projeto ${project.id}: erro ${tasksResp.status}`);
                    }
                }

                // Estatísticas
                const totalTasks = Object.values(tasksMap).reduce((a, b) => a + b.length, 0);
                const completedTasks = Object.values(tasksMap).flat().filter(t => t.status === 'concluido').length;
                const overdueTasks = Object.values(tasksMap).flat().filter(t => t.status === 'atrasado').length;

                console.log('📊 ESTATÍSTICAS DO DASHBOARD:');
                console.log(`   Projetos: ${projects.length}`);
                console.log(`   Tarefas total: ${totalTasks}`);
                console.log(`   Concluídas: ${completedTasks}`);
                console.log(`   Atrasadas: ${overdueTasks}`);
                console.log(`   Progresso médio: ${(projects.reduce((a, p) => a + (p.progresso_percentual || 0), 0) / projects.length).toFixed(1)}%`);

                console.log('✅ DASHBOARD TESTADO COM SUCESSO!');
                console.log('Próximo passo: Abrir http://localhost:8000/projects/dashboard.html no navegador');

            } catch (error) {
                console.error('❌ Erro durante teste:', error.message);
                console.error('Stack:', error.stack);
            }
        }

        // Auto-execute on load
        window.addEventListener('load', function() {
            console.log('🚀 Página de teste carregada');
            console.log('Iniciando teste automático em 2 segundos...');
            
            // Auto-test
            setTimeout(() => {
                setupAuth();
                testDashboard();
            }, 2000);
        });
    </script>
</body>
</html>
