<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos — Gerenciador de Projetos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="jira-theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="layout.js" defer></script>
</head>
<body>
    <!-- Botão flutuante para criar projeto - Jira style -->
    <button id="newProjectBtn" class="jira-fab" title="Novo Projeto">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <main class="container">
        <!-- Stats Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon stat-icon-blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Projetos Ativos</span>
                    <span class="stat-value" id="statActive">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon stat-icon-yellow">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Tarefas Pendentes</span>
                    <span class="stat-value" id="statPending">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon stat-icon-red">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Atrasadas</span>
                    <span class="stat-value" id="statDelayed">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon stat-icon-green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Progresso Médio</span>
                    <span class="stat-value" id="statProgress">0%</span>
                </div>
            </div>
        </section>

        <!-- Filtros e Busca -->
        <section class="filters-section">
            <div class="search-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar projetos..." class="search-input">
            </div>
            
            <div class="filter-group">
                <select id="filterStatus" class="filter-select">
                    <option value="all">Todos os status</option>
                    <option value="planejamento">📋 Planejamento</option>
                    <option value="em_andamento">🚧 Em Andamento</option>
                    <option value="pausado">⏸️ Pausado</option>
                    <option value="concluido">✅ Concluído</option>
                    <option value="cancelado">❌ Cancelado</option>
                </select>
                
                <button id="clearFilters" class="btn btn-ghost">
                    Limpar Filtros
                </button>
            </div>
        </section>

        <!-- Lista de Projetos -->
        <section class="projects-grid" id="projectsGrid">
            <!-- Cards serão renderizados via JavaScript -->
        </section>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📁</div>
            <h3>Nenhum projeto encontrado</h3>
            <p>Crie seu primeiro projeto clicando no botão "+" abaixo</p>
        </div>
    </main>

    <!-- Modal de Projeto - Jira Style -->
    <div class="jira-modal-backdrop" id="projectModal" style="display:none;">
        <div class="jira-modal">
            <div class="jira-modal-header">
                <h2 class="jira-modal-title" id="modalTitle">Novo Projeto</h2>
                <button class="jira-modal-close" id="closeModal">&times;</button>
            </div>
            
            <form id="projectForm">
                <div class="jira-modal-body">
                <input type="hidden" id="projectId">
                
                <div class="form-section-jira">
                    <div class="form-section-title">📋 Informações Básicas</div>
                    
                <div class="form-group-jira">
                    <label class="form-label required">Nome do Projeto</label>
                    <input type="text" id="projectName" class="form-input" placeholder="Ex: Edifício Residencial Centro" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group-jira">
                        <label class="form-label">Cidade/Localização</label>
                        <input type="text" id="projectCity" class="form-input" placeholder="Ex: São Paulo, SP">
                    </div>
                    
                    <div class="form-group-jira">
                        <label class="form-label">Cliente/Gerente</label>
                        <input type="text" id="projectManager" class="form-input" placeholder="Nome do responsável">
                    </div>
                </div>
                </div>
                
                <div class="form-section-jira">
                    <div class="form-section-title">📅 Cronograma</div>
                <div class="form-row">
                    <div class="form-group-jira">
                        <label class="form-label">Data de Início</label>
                        <input type="date" id="projectStart" class="form-input">
                    </div>
                    
                    <div class="form-group-jira">
                        <label class="form-label">Data de Conclusão</label>
                        <input type="date" id="projectEnd" class="form-input">
                    </div>
                </div>
                </div>
                
                <div class="form-section-jira">
                    <div class="form-section-title">📊 Status</div>
                <div class="form-row">
                    <div class="form-group-jira">
                        <label class="form-label">Status</label>
                        <select id="projectStatus" class="form-select">
                            <option value="planejamento">📋 Planejamento</option>
                            <option value="em_andamento">🚧 Em Andamento</option>
                            <option value="pausado">⏸️ Pausado</option>
                            <option value="concluido">✅ Concluído</option>
                            <option value="cancelado">❌ Cancelado</option>
                        </select>
                    </div>
                    
                    <div class="form-group-jira">
                        <label class="form-label">Progresso: <span id="progressValue">0</span>%</label>
                        <input type="range" id="projectProgress" class="form-input" min="0" max="100" value="0" style="cursor:pointer;">
                    </div>
                </div>
                </div>
                
                <!-- Código de Acesso (somente visualização na edição) -->
                <div class="form-group-jira" id="codeGroup" style="display: none;">
                    <label class="form-label">Código de Acesso</label>
                    <div style="display:flex;align-items:center;gap:8px;background:var(--bg-surface-hover);padding:10px;border-radius:6px;">
                        <span id="projectCode" style="font-family:monospace;font-weight:600;">-</span>
                        <button type="button" id="copyCode" class="btn-jira-subtle" title="Copiar código">
                            📋 Copiar
                        </button>
                    </div>
                    <small style="color:#6B778C;font-size:0.8rem;">Compartilhe este código para que outros possam entrar no projeto</small>
                </div>
                </div>
                
                <div class="jira-modal-footer">
                    <button type="button" class="btn-jira btn-jira-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn-jira btn-jira-primary" id="saveBtn">
                        <span id="saveBtnText">Criar Projeto</span>
                        <span class="jira-spinner" id="saveBtnLoading" style="display: none; width:16px; height:16px;"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../api-client.js"></script>
    <script src="app.js"></script>
    
    <!-- Segurança e Compatibilidade -->
    <script src="../js/security-manager.js"></script>
    <script src="../js/compatibility-tester.js"></script>
    
    <!-- PWA -->
    <script src="../pwa-installer.js"></script>
</body>
</html>
