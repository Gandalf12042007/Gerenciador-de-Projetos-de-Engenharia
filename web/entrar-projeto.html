<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar em Projeto - Gerenciador de Projetos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: 
                radial-gradient(ellipse at top left, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                var(--bg-primary);
        }

        .container {
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.5s ease forwards;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-xl);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-icon {
            width: 72px;
            height: 72px;
            background: var(--gradient-success);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin: 0;
        }

        .code-input-group {
            margin-bottom: 24px;
        }

        .code-input {
            width: 100%;
            padding: 20px;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 12px;
            text-transform: uppercase;
            background: var(--bg-tertiary);
            border: 3px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            color: var(--text-primary);
            transition: all var(--transition-normal);
        }

        .code-input::placeholder {
            color: var(--text-muted);
            letter-spacing: 8px;
            font-size: 1.5rem;
        }

        .code-input:focus {
            outline: none;
            border-color: var(--color-success);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
        }

        .code-input.valid {
            border-color: var(--color-success);
        }

        .code-input.invalid {
            border-color: var(--color-error);
        }

        .code-format {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 12px;
        }

        .code-format strong {
            color: var(--text-secondary);
        }

        .project-preview {
            background: var(--bg-tertiary);
            border: 1px solid var(--color-success);
            border-radius: var(--border-radius-md);
            padding: 16px;
            margin-bottom: 24px;
            display: none;
        }

        .project-preview.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .project-preview-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .project-preview-icon {
            width: 40px;
            height: 40px;
            background: var(--color-success-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .project-preview-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .project-preview-found {
            color: var(--color-success);
            font-size: 0.8125rem;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 20px;
        }

        .btn-dashboard {
            width: 100%;
            padding: 16px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-dashboard:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-light);
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: var(--border-radius-md);
            margin-bottom: 32px;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            color: white;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-email {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .btn-logout {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: var(--border-radius-sm);
            transition: all var(--transition-fast);
        }

        .btn-logout:hover {
            background: var(--bg-card);
            color: var(--color-error);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake { animation: shake 0.5s ease-in-out; }

        @media (max-width: 480px) {
            .card {
                padding: 24px;
            }
            
            .code-input {
                font-size: 1.5rem;
                letter-spacing: 8px;
                padding: 16px;
            }
            
            .code-input::placeholder {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="user-info">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div class="user-name" id="userName">Usuário</div>
                        <div class="user-email" id="userEmail">email@exemplo.com</div>
                    </div>
                </div>
                <button class="btn-logout" id="btnLogout" title="Sair">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div class="header">
                <div class="header-icon">🔑</div>
                <h1>Entrar em um Projeto</h1>
                <p>Digite o código de acesso fornecido pelo gerente do projeto</p>
            </div>

            <div id="alert" class="alert" style="display: none;"></div>

            <form id="codeForm">
                <div class="code-input-group">
                    <input type="text" id="codigo" name="codigo" class="code-input" 
                           placeholder="A1234" maxlength="5" autocomplete="off" 
                           pattern="[A-Za-z][0-9]{4}" required>
                    <div class="code-format">
                        Formato: <strong>1 letra + 4 números</strong> (ex: A1234, B9876)
                    </div>
                </div>

                <div class="project-preview" id="projectPreview">
                    <div class="project-preview-header">
                        <div class="project-preview-icon">📁</div>
                        <div>
                            <div class="project-preview-name" id="projectName">Nome do Projeto</div>
                            <div class="project-preview-found">✓ Projeto encontrado</div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-full" id="btnEntrar">
                    <span id="btnText">Entrar no Projeto</span>
                    <span id="btnLoading" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="divider"><span>ou</span></div>

            <button type="button" class="btn-dashboard" id="btnDashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Ir para o Dashboard
            </button>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        // Check authentication
        if (!api.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        // User info
        const user = api.user || {};
        document.getElementById('userName').textContent = user.nome || 'Usuário';
        document.getElementById('userEmail').textContent = user.email || '';
        document.getElementById('userAvatar').textContent = (user.nome || 'U').charAt(0).toUpperCase();

        const form = document.getElementById('codeForm');
        const codigoInput = document.getElementById('codigo');
        const btnEntrar = document.getElementById('btnEntrar');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const alertDiv = document.getElementById('alert');
        const projectPreview = document.getElementById('projectPreview');
        const projectName = document.getElementById('projectName');

        let validatedProject = null;
        let debounceTimer = null;

        // Auto-uppercase and format
        codigoInput.addEventListener('input', (e) => {
            let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            
            // Ensure first char is letter
            if (value.length > 0 && !/[A-Z]/.test(value[0])) {
                value = value.substring(1);
            }
            
            // Limit to format: 1 letter + 4 digits
            if (value.length > 1) {
                const letter = value[0];
                const numbers = value.substring(1).replace(/[^0-9]/g, '').substring(0, 4);
                value = letter + numbers;
            }
            
            e.target.value = value;
            
            // Validate on 5 characters
            if (value.length === 5) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => validateCode(value), 300);
            } else {
                projectPreview.classList.remove('active');
                codigoInput.classList.remove('valid', 'invalid');
                validatedProject = null;
            }
        });

        async function validateCode(codigo) {
            try {
                const response = await api.get(`/projetos/verificar-codigo/${codigo}`);
                
                if (response.valido) {
                    codigoInput.classList.add('valid');
                    codigoInput.classList.remove('invalid');
                    projectName.textContent = response.projeto_nome;
                    projectPreview.classList.add('active');
                    validatedProject = codigo;
                } else {
                    codigoInput.classList.add('invalid');
                    codigoInput.classList.remove('valid');
                    projectPreview.classList.remove('active');
                    validatedProject = null;
                }
            } catch (error) {
                codigoInput.classList.add('invalid');
                codigoInput.classList.remove('valid');
                projectPreview.classList.remove('active');
                validatedProject = null;
            }
        }

        function showAlert(message, type = 'error') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'flex';
            
            if (type === 'error') {
                alertDiv.classList.add('shake');
                setTimeout(() => alertDiv.classList.remove('shake'), 500);
            }
        }

        function setLoading(loading) {
            btnEntrar.disabled = loading;
            btnText.style.display = loading ? 'none' : 'inline';
            btnLoading.style.display = loading ? 'inline-block' : 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const codigo = codigoInput.value.trim().toUpperCase();
            
            if (codigo.length !== 5) {
                showAlert('Código deve ter 5 caracteres (1 letra + 4 números)');
                return;
            }
            
            if (!/^[A-Z][0-9]{4}$/.test(codigo)) {
                showAlert('Formato inválido. Use: 1 letra + 4 números (ex: A1234)');
                return;
            }

            setLoading(true);
            alertDiv.style.display = 'none';

            try {
                const response = await api.post('/projetos/entrar-por-codigo', { codigo });
                
                showAlert(response.message || 'Você entrou no projeto!', 'success');
                
                // Salvar projeto atual
                localStorage.setItem('current_project', JSON.stringify(response.projeto));
                
                setTimeout(() => {
                    window.location.href = 'projects/index.html';
                }, 1000);

            } catch (error) {
                showAlert(error.message || 'Código não encontrado ou inválido');
                setLoading(false);
            }
        });

        // Dashboard button
        document.getElementById('btnDashboard').addEventListener('click', () => {
            window.location.href = 'projects/index.html';
        });

        // Logout button
        document.getElementById('btnLogout').addEventListener('click', () => {
            api.logout();
            window.location.href = 'login.html?logout=true';
        });
    </script>
</body>
</html>
