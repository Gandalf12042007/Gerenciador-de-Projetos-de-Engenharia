[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosidade
addopts = -v --tb=short --strict-markers

# Marcadores customizados
markers =
    unit: Testes unitários (sem dependências externas)
    integration: Testes de integração
    security: Testes de segurança
    slow: Testes lentos (podem ser pulados com -m "not slow")

# Cobertura (descomente para usar)
# addopts = --cov=. --cov-report=term-missing --cov-report=html

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout padrão para testes
timeout = 30

# Cache
cache_dir = .pytest_cache

# Output
console_output_style = progress

# Paralelização (use -n auto para rodar em paralelo)
# Requer pytest-xdist
# addopts = -n auto

# Cobertura mínima (falha se abaixo)
# fail_under = 80
