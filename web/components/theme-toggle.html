<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Toggle - Componente</title>
  <style>
    :root {
      --color-primary-500: #0ea5e9;
      --color-neutral-900: #111827;
      --color-neutral-50: #f9fafb;
      --transition-normal: 250ms ease-in-out;
    }

    [data-theme="dark"] {
      --color-primary-500: #38bdf8;
      --color-neutral-900: #f9fafb;
      --color-neutral-50: #111827;
    }
  </style>
</head>
<body>
  <!-- =======================================
       THEME TOGGLE BUTTON
       Componente reutilizável para alternar tema
       ======================================= -->

  <button 
    class="theme-toggle"
    id="theme-toggle"
    aria-label="Alternar modo claro/escuro"
    title="Clique para alternar modo claro/escuro"
    onclick="themeManager && themeManager.toggleTheme()"
  >
    <span class="theme-icon">
      <!-- Sun Icon (Mostrado em modo escuro) -->
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>

      <!-- Moon Icon (Mostrado em modo claro) -->
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </span>
    <span class="theme-label" aria-hidden="true"></span>
  </button>

  <!-- ========================================
       ESTILOS DO COMPONENTE
       ======================================== -->

  <style>
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      font-size: 1rem;
      color: var(--color-primary-500);
      transition: transform var(--transition-normal);
      border-radius: 0.5rem;
      position: relative;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      background-color: rgba(14, 165, 233, 0.1);
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    .theme-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      position: relative;
    }

    .sun-icon,
    .moon-icon {
      width: 100%;
      height: 100%;
      position: absolute;
      transition: opacity var(--transition-normal), transform var(--transition-normal);
    }

    /* Em modo claro, mostrar lua (botão para escuro) */
    [data-theme="light"] .sun-icon {
      opacity: 0;
      transform: rotate(-180deg);
      pointer-events: none;
    }

    [data-theme="light"] .moon-icon {
      opacity: 1;
      transform: rotate(0deg);
    }

    /* Em modo escuro, mostrar sol (botão para claro) */
    [data-theme="dark"] .sun-icon {
      opacity: 1;
      transform: rotate(0deg);
    }

    [data-theme="dark"] .moon-icon {
      opacity: 0;
      transform: rotate(-180deg);
      pointer-events: none;
    }

    .theme-label {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.7;
      text-transform: uppercase;
    }

    /* Tooltip ao passar o mouse */
    .theme-toggle::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -2rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--color-neutral-900);
      color: var(--color-neutral-50);
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
      z-index: 1000;
    }

    .theme-toggle:hover::after {
      opacity: 1;
    }

    /* Responsividade */
    @media screen and (max-width: 480px) {
      .theme-toggle {
        padding: 0.25rem;
      }

      .theme-icon {
        width: 1.25rem;
        height: 1.25rem;
      }

      .theme-label {
        display: none;
      }
    }
  </style>

  <!-- ========================================
       SCRIPT DE DEMONSTRAÇÃO
       ======================================== -->

  <script src="./theme-manager.js"></script>

  <script>
    // Demonstração e testes
    document.addEventListener('DOMContentLoaded', () => {
      console.log('✅ Theme Toggle carregado');

      // Adicionar label dinâmica
      const toggle = document.getElementById('theme-toggle');
      if (toggle) {
        const updateLabel = () => {
          const isDark = themeManager.isDarkMode();
          toggle.querySelector('.theme-label').textContent = isDark ? 'Claro' : 'Escuro';
          toggle.setAttribute('data-tooltip', isDark ? 'Ativar modo claro' : 'Ativar modo escuro');
        };

        updateLabel();

        // Ouvir mudanças de tema
        window.addEventListener('themechange', (e) => {
          console.log(`🎨 Tema alterado: ${e.detail.theme}`);
          updateLabel();
        });
      }
    });

    // Exemplo: Alternar tema via console
    window.toggleTheme = () => {
      if (themeManager) {
        themeManager.toggleTheme();
      }
    };

    console.log('💡 Dica: Execute toggleTheme() no console para alternar tema');
  </script>
</body>
</html>
