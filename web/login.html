<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Projetos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: 
                radial-gradient(ellipse at top, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                var(--bg-primary);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.5s ease forwards;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-xl);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.8125rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 16px;
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-google:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-light);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
        }

        .form-footer a {
            color: var(--color-primary);
            font-weight: 500;
            font-size: 0.875rem;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .register-link {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }

        .register-link a {
            color: var(--color-primary);
            font-weight: 600;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .form-input {
            padding-right: 48px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--color-primary);
            cursor: pointer;
        }

        .checkbox-group label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            user-select: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }
            
            .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }
            
            .logo h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">🏗️</div>
                <h1>Gerenciador de Projetos</h1>
                <p>Engenharia Civil</p>
            </div>

            <div id="alert" class="alert" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" 
                           required placeholder="seu@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" class="form-input" 
                               required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="password-toggle" id="togglePassword">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="manterConectado" name="manterConectado">
                    <label for="manterConectado">Manter conectado</label>
                </div>

                <button type="submit" class="btn btn-primary w-full" id="btnLogin">
                    <span id="btnText">Entrar</span>
                    <span id="btnLoading" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="form-footer">
                <a href="forgot-password.html">Esqueci minha senha</a>
            </div>

            <div class="divider"><span>ou</span></div>

            <button type="button" class="btn-google" id="btnGoogleLogin">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Entrar com Google
            </button>

            <div class="register-link">
                Não tem conta? <a href="register.html">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const alertDiv = document.getElementById('alert');
        const togglePassword = document.getElementById('togglePassword');
        const senhaInput = document.getElementById('senha');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
            senhaInput.setAttribute('type', type);
        });

        // Check logout param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            api.logout();
            window.history.replaceState({}, document.title, 'login.html');
        }

        // Check if already authenticated
        if (api.isAuthenticated() && api.user && api.user.id && !urlParams.get('logout')) {
            api.get('/projetos').then(() => {
                window.location.href = 'entrar-projeto.html';
            }).catch(() => {
                api.logout();
            });
        }

        function showAlert(message, type = 'error') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'flex';
            
            if (type === 'error') {
                alertDiv.classList.add('shake');
                setTimeout(() => alertDiv.classList.remove('shake'), 500);
            }
            
            if (type !== 'error') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
        }

        function setLoading(loading) {
            btnLogin.disabled = loading;
            btnText.style.display = loading ? 'none' : 'inline';
            btnLoading.style.display = loading ? 'inline-block' : 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const manterConectado = document.getElementById('manterConectado').checked;

            if (!email || !senha) {
                showAlert('Por favor, preencha todos os campos');
                return;
            }

            setLoading(true);
            alertDiv.style.display = 'none';

            try {
                const response = await api.login(email, senha);
                
                const user = {
                    id: response.user_id,
                    nome: response.nome,
                    email: response.email
                };
                
                api.setAuth(response.access_token, user);
                
                if (manterConectado) {
                    localStorage.setItem('keep_logged_in', 'true');
                } else {
                    sessionStorage.setItem('session_only', 'true');
                    localStorage.removeItem('keep_logged_in');
                }
                
                showAlert('Login realizado com sucesso!', 'success');
                
                setTimeout(() => {
                    window.location.href = 'entrar-projeto.html';
                }, 800);

            } catch (error) {
                showAlert(error.message || 'Email ou senha incorretos');
                setLoading(false);
            }
        });

        // Google Sign-In (simulado)
        document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
            const mockUser = {
                id: Date.now(),
                nome: 'Usuário Google',
                email: 'usuario@gmail.com'
            };

            const mockToken = 'google_mock_' + Date.now();
            api.setAuth(mockToken, mockUser);
            localStorage.setItem('keep_logged_in', 'true');

            showAlert('Login com Google realizado!', 'success');
            setTimeout(() => {
                window.location.href = 'entrar-projeto.html';
            }, 800);
        });
    </script>
</body>
</html>
