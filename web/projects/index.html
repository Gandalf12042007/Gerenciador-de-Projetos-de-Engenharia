<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projetos — Gerenciador de Projetos de Engenharia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Projetos</h1>
    <div class="top-controls">
      <button id="newProjectBtn" class="btn primary">Criar novo projeto</button>
      <button id="logoutBtn" class="btn" style="margin-left:10px;">Sair</button>
    </div>
  </header>

  <main class="container">
    <!-- Modal Projeto -->
    <div id="projectModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span class="close" id="closeProjectModal">&times;</span>
        <h2 id="modalTitle">Novo Projeto</h2>
        <form id="projectForm">
          <input type="hidden" id="projectId" />
          <div class="form-group">
            <label for="projectName">Nome do Projeto</label>
            <input type="text" id="projectName" required />
          </div>
          <div class="form-group">
            <label for="projectCity">Cidade</label>
            <input type="text" id="projectCity" />
          </div>
          <div class="form-group">
            <label for="projectManager">Cliente/Gerente</label>
            <input type="text" id="projectManager" />
          </div>
          <div class="form-group">
            <label for="projectStart">Data de Início</label>
            <input type="date" id="projectStart" />
          </div>
          <div class="form-group">
            <label for="projectEnd">Data de Conclusão Prevista</label>
            <input type="date" id="projectEnd" />
          </div>
          <div class="form-group">
            <label for="projectStatus">Status</label>
            <select id="projectStatus">
              <option value="planejamento">Planejamento</option>
              <option value="em_andamento">Em Andamento</option>
              <option value="pausado">Pausado</option>
              <option value="concluido">Concluído</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="projectProgress">Progresso (%)</label>
            <input type="number" id="projectProgress" min="0" max="100" value="0" />
          </div>
          <button type="submit" class="btn primary" id="saveProjectBtn">Salvar</button>
        </form>
      </div>
    </div>
    <section class="dashboard">
      <div class="metrics">
        <div class="metric">Obras ativas<br><strong id="count-active">0</strong></div>
        <div class="metric">Tarefas pendentes<br><strong id="count-pending">0</strong></div>
        <div class="metric">Tarefas atrasadas<br><strong id="count-delayed">0</strong></div>
        <div class="metric">% Progresso médio<br><strong id="avg-progress">0%</strong></div>
      </div>

      <div class="filters">
        <label>
          Status:
          <select id="filter-status">
            <option value="all">Todos</option>
            <option value="planejamento">Planejamento</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="pausado">Pausado</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </label>

        <label>
          Procurar:
          <input id="filter-q" placeholder="Nome do projeto, cidade..." />
        </label>

        <button id="clearFilters" class="btn">Limpar</button>
      </div>
    </section>

    <section class="project-list" id="projectList">
      <!-- Cards will be rendered here -->
    </section>
  </main>

  <script src="../api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
