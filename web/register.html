<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Gerenciador de Projetos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: 
                linear-gradient(135deg, rgba(30, 58, 95, 0.90) 0%, rgba(15, 39, 68, 0.85) 100%),
                url('bg-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1E3A5F;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1E3A5F;
        }

        .password-requirements {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .password-requirements ul {
            margin-top: 3px;
            padding-left: 18px;
        }

        .password-requirements li.valid {
            color: #2a7;
        }

        .password-requirements li.invalid {
            color: #c33;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1E3A5F 0%, #2C5282 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 58, 95, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #1E3A5F;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #2a7;
            border: 1px solid #cfc;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>🏗️ Gerenciador</h1>
            <p>Crie sua conta</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required 
                       placeholder="Seu nome completo" minlength="3">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required 
                       placeholder="seu@email.com">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" 
                           placeholder="(11) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="cargo">Cargo/Função</label>
                    <select id="cargo" name="cargo">
                        <option value="Engenheiro">Engenheiro</option>
                        <option value="Arquiteto">Arquiteto</option>
                        <option value="Técnico">Técnico</option>
                        <option value="Gestor">Gestor</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" name="senha" required 
                       placeholder="Mínimo 8 caracteres" minlength="8">
                <div class="password-requirements">
                    <ul>
                        <li id="req-length">Mínimo 8 caracteres</li>
                        <li id="req-upper">Pelo menos 1 letra maiúscula</li>
                        <li id="req-number">Pelo menos 1 número</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar Senha *</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required 
                       placeholder="Repita a senha">
            </div>

            <button type="submit" class="btn-register" id="btnRegister">
                Criar Conta
            </button>

            <div class="loading" id="loading">Criando conta...</div>
        </form>

        <div class="login-link">
            Já tem conta? <a href="login.html">Faça login</a>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const btnRegister = document.getElementById('btnRegister');
        const loading = document.getElementById('loading');
        const alertDiv = document.getElementById('alert');
        const senhaInput = document.getElementById('senha');

        // Validação em tempo real da senha
        senhaInput.addEventListener('input', validatePassword);

        function validatePassword() {
            const senha = senhaInput.value;
            
            const reqLength = document.getElementById('req-length');
            const reqUpper = document.getElementById('req-upper');
            const reqNumber = document.getElementById('req-number');

            // Mínimo 8 caracteres
            if (senha.length >= 8) {
                reqLength.classList.add('valid');
                reqLength.classList.remove('invalid');
            } else {
                reqLength.classList.add('invalid');
                reqLength.classList.remove('valid');
            }

            // Pelo menos 1 maiúscula
            if (/[A-Z]/.test(senha)) {
                reqUpper.classList.add('valid');
                reqUpper.classList.remove('invalid');
            } else {
                reqUpper.classList.add('invalid');
                reqUpper.classList.remove('valid');
            }

            // Pelo menos 1 número
            if (/[0-9]/.test(senha)) {
                reqNumber.classList.add('valid');
                reqNumber.classList.remove('invalid');
            } else {
                reqNumber.classList.add('invalid');
                reqNumber.classList.remove('valid');
            }
        }

        function showAlert(message, type = 'error') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
        }

        function isPasswordValid(senha) {
            return senha.length >= 8 && /[A-Z]/.test(senha) && /[0-9]/.test(senha);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const cargo = document.getElementById('cargo').value;
            const senha = senhaInput.value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            // Validações
            if (nome.length < 3) {
                showAlert('Nome deve ter pelo menos 3 caracteres.');
                return;
            }

            if (!isPasswordValid(senha)) {
                showAlert('Senha não atende aos requisitos mínimos.');
                return;
            }

            if (senha !== confirmarSenha) {
                showAlert('As senhas não coincidem.');
                return;
            }

            btnRegister.disabled = true;
            loading.classList.add('active');
            alertDiv.style.display = 'none';

            try {
                await api.register(nome, email, senha, cargo);
                showAlert('Conta criada com sucesso! Redirecionando...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                showAlert(error.message || 'Erro ao criar conta. Tente novamente.');
            } finally {
                btnRegister.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
